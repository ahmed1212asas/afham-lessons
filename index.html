<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أفهم درسك مع مستر أحمد</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- شاشة تسجيل الدخول -->
        <div id="login-screen" class="screen active">
            <h1>📚 أفهم درسك مع مستر أحمد</h1>
            <p>أدخل بياناتك لبدء رحلة التعلم</p>
            <input type="text" id="username" placeholder="اسم الطالب">
            <input type="password" id="password" placeholder="كلمة المرور">
            <button onclick="login()">تسجيل الدخول</button>
        </div>

        <!-- شاشة اختيار الصف والمادة -->
        <div id="class-screen" class="screen">
            <h2>اختر صفك الدراسي</h2>
            <select id="grade-select">
                <option value="">-- اختر الصف --</option>
                <option value="g1">الصف الأول الثانوي</option>
                <option value="g2">الصف الثاني الثانوي</option>
                <option value="g3">الصف الثالث الثانوي</option>
            </select>
            <h2>اختر المادة</h2>
            <select id="subject-select">
                <option value="">-- اختر المادة --</option>
                <option value="math">الرياضيات</option>
                <option value="physics">الفيزياء</option>
                <option value="chemistry">الكيمياء</option>
                <option value="biology">الأحياء</option>
            </select>
            <button onclick="startLesson()">ابدأ الدرس</button>
        </div>

        <!-- شاشة تصوير ورفع الصور -->
        <div id="camera-screen" class="screen">
            <h2>📸 صوّر أو ارفع صفحات الدرس</h2>
            <p>الحد الأقصى: 5 صور</p>
            <input type="file" id="imageInput" accept="image/*" capture="environment" multiple>
            <div id="preview-container" style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px;"></div>
            <p id="counter" style="margin-top: 10px; font-weight: bold;">0 / 5 صور</p>
            <button onclick="submitImages()">التالي: تحليل الدرس</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

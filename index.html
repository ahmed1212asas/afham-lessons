<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة مستر أحمد</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>منصة مستر أحمد</h1>
        <p class="subtitle">شاهد شرحك بذكاء</p>

        <div id="step-login" class="step active">
            <h2>أهلاً بك!</h2>
            <input type="text" id="studentName" placeholder="اكتب اسمك من فضلك">
            <button onclick="startApp()">ابدأ الآن</button>
        </div>

        <div id="step-subject" class="step">
            <h2>اختر صفك ومادتك</h2>
            <select id="grade">
                <option value="">-- الصف --</option>
                <option value="g1">الأول الثانوي</option>
                <option value="g2">الثاني الثانوي</option>
                <option value="g3">الثالث الثانوي</option>
            </select>
            <select id="subject">
                <option value="">-- المادة --</option>
                <option value="math">رياضيات</option>
                <option value="physics">فيزياء</option>
                <option value="chemistry">كيمياء</option>
            </select>
            <button onclick="startLesson()">اختر الدرس</button>
        </div>

        <div id="step-upload" class="step">
            <h2>صور صفحات الدرس</h2>
            <input type="file" id="images" accept="image/*" multiple>
            <div id="preview"></div>
            <button onclick="analyzeLesson()">حلل الدرس</button>
            <div id="aiResult"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@google/generative-ai@0.21.0/dist/index.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
